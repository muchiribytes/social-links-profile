<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Jessica Randall | Social Links Profile</title>
  <meta name="description"
    content="Front-end developer and avid reader based in London, United Kingdom. View social profiles and links.">
  <meta name="keywords" content="Frontend Developer, Web Development, Social Profile, Jessica Randall">
  <meta name="author" content="Jessica Randall">

  <meta property="og:title" content="Jessica Randall - Social Links Profile">
  <meta property="og:description" content="Front-end developer and avid reader based in London, United Kingdom.">
  <meta property="og:image" content="./assets/images/avatar-jessica.jpeg">
  <meta property="og:type" content="profile">

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <link rel="stylesheet" href="./style.css">
</head>

<body>

  <main class="profile-card" aria-label="Social Links Profile Card">
    <header class="profile-card__header">
      <img src="./assets/images/avatar-jessica.jpeg" alt="Portrait of Jessica Randall" class="profile-card__avatar"
        width="88" height="88">
      <h1 class="profile-card__name">Jessica Randall</h1>
      <p class="profile-card__location">London, United Kingdom</p>
    </header>

    <p class="profile-card__bio">&ldquo;Front-end developer and avid reader.&rdquo;</p>

    <nav aria-label="Social Media Links">
      <ul class="profile-card__links-list">
        <li class="profile-card__links-item">
          <a href="https://github.com" class="profile-card__link" target="_blank" rel="noopener noreferrer">GitHub</a>
        </li>
        <li class="profile-card__links-item">
          <a href="https://www.frontendmentor.io" class="profile-card__link" target="_blank"
            rel="noopener noreferrer">Frontend Mentor</a>
        </li>
        <li class="profile-card__links-item">
          <a href="https://linkedin.com" class="profile-card__link" target="_blank"
            rel="noopener noreferrer">LinkedIn</a>
        </li>
        <li class="profile-card__links-item">
          <a href="https://x.com" class="profile-card__link" target="_blank" rel="noopener noreferrer">Twitter</a>
        </li>
        <li class="profile-card__links-item">
          <a href="https://instagram.com" class="profile-card__link" target="_blank"
            rel="noopener noreferrer">Instagram</a>
        </li>
      </ul>
    </nav>
  </main>

  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank"
      rel="noopener noreferrer">Frontend Mentor</a>.
    Coded by <a href="https://github.com/muchiribytes" target="_blank" rel="noopener noreferrer">Muchiri Bytes</a>.
  </footer>

</body>

</html>
